# Build, vet, and test anvil-engine on Linux and Windows using Go.
# Sibling Go dependencies anvil-compress, anvil-image, and anvil-ttf are checked out alongside anvil-engine.

name: ci

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: anvil-engine
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-engine

      - name: Check out sibling repositories
        working-directory: .
        run: |
          for repo in anvil-compress anvil-image anvil-ttf; do
            git clone --depth 1 -b "${{ github.ref_name }}" "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo" 2>/dev/null || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: false

      - name: Check for outside Go modules
        run: |
          if grep -E 'github\.com/' go.mod | grep -v 'github\.com/buntatoes/anvil-'; then
            echo "go.mod lists a module outside the anvil repositories."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build CLI and worker binary
        run: go build ./cmd/anvil-engine
