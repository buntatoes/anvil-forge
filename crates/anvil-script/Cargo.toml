# Budgeted script interpreter. Mutates anvil-dom, parses JSON with anvil-json,
# and links the Cinder engine directly (`../anvil-browser/engines/cinder`).
# fetch() is same-origin only and runs in the Rust interpreter.
# A registered mock wins. Otherwise a host callback runs. This crate does not
# open a socket and does not link anvil-net. The numeric VM does not perform fetch.
# anvil-browser implements the host with anvil-net.

[package]
name = "anvil-script"
description = "Budgeted script interpreter and numeric x86-64 compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
publish.workspace = true

[dependencies]
anvil-dom = { path = "../anvil-dom" }
anvil-style = { path = "../anvil-style" }
anvil-layout = { path = "../anvil-layout" }
anvil-video.workspace = true
