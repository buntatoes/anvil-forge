# Page engine. Crate version 0.24.5. Not published.
#
# Page pipeline, in order:
#   anvil-dom parses HTML into one node list.
#   anvil-style computes the cascade for those nodes and links the Prism engine (`../anvil-browser/engines/prism`) directly.
#   anvil-layout places boxes and measures text with anvil-ttf.
#   anvil-paint records a display list and applies zoom.
#   anvil-raster fills a CPU framebuffer from that list (with C++20 scanline/SDF/compositor helpers).
#
# anvil-script runs a budgeted JS runtime, WebAssembly 1.0 stack VM, and C++20 CinderVM register bytecode interpreter
# against the document and links the Cinder engine (`../anvil-browser/engines/cinder`) directly. It does not open a socket and does not link anvil-net.
#
# anvil-browser links these crates by path.
# Dual-licensed under noncommercial terms based on PolyForm Noncommercial 1.0.0 and Paid Commercial (Non-Compete):
# LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial across anvil-browser, anvil-engine, and all sibling libraries.

[workspace]
resolver = "3"
members = [
    "crates/anvil-dom",
    "crates/anvil-style",
    "crates/anvil-layout",
    "crates/anvil-paint",
    "crates/anvil-raster",
    "crates/anvil-script",
]

[workspace.package]
version = "0.24.5"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato"]
description = "Anvil Forge Engine: HTML, CSS, layout, raster, and a budgeted script runtime."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
repository = "https://github.com/buntatoes/anvil-engine"
publish = false

[workspace.dependencies]
anvil-image = { path = "../anvil-image" }
anvil-ttf = { path = "../anvil-ttf" }
anvil-gpu = { path = "../anvil-gpu" }
anvil-video = { path = "../anvil-video" }
